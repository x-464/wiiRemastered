<svg class="gamePath" viewBox="0 0 200 113" xmlns="http://www.w3.org/2000/svg">

    <style>
        .channelWii{
            fill: #4a4a4a;
            font-family: "Roboto";
            font-weight: 650;
            font-size: 1.75rem;
            opacity: 5%;
            user-select: none;
            pointer-events: none;
        }
    </style>

    <defs>
        <clipPath id="nullGameClip">
            <path transform="translate(5 6)" d="M190,51.5c0-21.61-1.04-39.36-2.36-41.31-2.14-5.92-8.1-10.19-15.14-10.19H17.5C10.46,0,4.5,4.27,2.36,10.19,1.04,12.14,0,29.89,0,51.5s1.04,39.36,2.36,41.31c2.14,5.92,8.1,10.19,15.14,10.19h155c7.04,0,13-4.27,15.14-10.19,1.32-1.96,2.36-19.7,2.36-41.31Z" />
        </clipPath>
        <pattern id="nullLineFill" width="4" height="5" patternUnits="userSpaceOnUse">
            <rect width="4" height="1" fill="rgb(190, 190, 190)" />
            <rect y="1" width="4" height="4" fill="rgb(167, 167, 167)" />
        </pattern>
    </defs>

    <!-- TV static, driven by main.js: the scanline rect is one stripe period
         taller than the card and scrolled via transform; the noise image
         cycles pre-rendered white-alpha speckle frames (compositing white
         with alpha over the stripes is exactly the old screen blend). -->
    <g clip-path="url(#nullGameClip)" opacity="0.6">
        <rect class="nullScan" x="5" y="1" width="190" height="113.2" fill="url(#nullLineFill)" />
        <image class="nullNoise"
            x="5" y="6" width="190" height="103.2"
            preserveAspectRatio="none"
        />
    </g>

    <path class="gameStroke" transform="translate(5 6)" d="M190,51.5c0-21.61-1.04-39.36-2.36-41.31-2.14-5.92-8.1-10.19-15.14-10.19H17.5C10.46,0,4.5,4.27,2.36,10.19,1.04,12.14,0,29.89,0,51.5s1.04,39.36,2.36,41.31c2.14,5.92,8.1,10.19,15.14,10.19h155c7.04,0,13-4.27,15.14-10.19,1.32-1.96,2.36-19.7,2.36-41.31Z"
        fill="none"
        stroke="#bbbbbb"
        stroke-width="2"
    />

    <text class="channelWii">
        <tspan x="79" y="69">Wii</tspan>
    </text>

</svg>
